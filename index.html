  <style>

    #game{display:block;width:min(100vw,calc(100vh * 1.7777778));height:min(100vh,calc(100vw / 1.7777778));max-width:1600px;max-height:900px;border:1px solid rgba(103,218,255,.35);border-radius:14px;background:#07131f;box-shadow:0 22px 90px #000b,0 0 50px #218fd526;cursor:default}

    #loading small,#rotate small{display:block;margin-top:12px;color:#7ca4b6;font-size:13px;letter-spacing:.02em}.loader{width:260px;height:8px;margin:24px auto 0;border-radius:8px;background:#102b3a;overflow:hidden}.loader i{display:block;width:55%;height:100%;background:linear-gradient(90deg,#45d5ff,#a76aff);animation:load 1.15s ease-in-out infinite alternate}@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(180%)}}
    #loading.ready{opacity:0;pointer-events:none;transition:opacity .35s ease}#rotate{display:none;padding:30px}.phone{width:74px;height:120px;border:5px solid #6ddcff;border-radius:14px;margin:0 auto 28px;animation:turn 1.8s ease-in-out infinite}@keyframes turn{0%,25%{transform:rotate(0)}70%,100%{transform:rotate(90deg)}}
    @media(orientation:portrait) and (max-width:900px){#rotate{display:grid}}@media(max-height:520px){#game{border-radius:7px}}
  </style>
  <script async src="https://sdk.crazygames.com/crazygames-sdk-v3.js" onload="window.dispatchEvent(new Event('crazygames-sdk-ready'))"></script>

<script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),loading=document.getElementById("loading");
const W=1280,H=720,TAU=Math.PI*2,FIELD_TOP=82,FIELD_BOTTOM=604;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,dist=(a,b,c,d)=>Math.hypot(a-c,b-d);

const ART={
  menu:"assets/ui/menu-hero.webp",vehicle:"assets/convoy/vehicles-top.webp",helicopter:"assets/towers/levels/helicopter.webp",airplane:"assets/towers/levels/airplane.webp",

  {id:"rocket",name:"RIFT ROCKETS",short:"ROCKET",color:"#ff8658",accent:"#ffd0a6",cost:135,unlock:0,damage:56,rate:.72,range:340,splash:82,desc:"Heavy splash damage with a slower reload."},
  {id:"repair",name:"REPAIR MATRIX",short:"REPAIR",color:"#77f1b0",accent:"#d7ffe9",cost:120,unlock:0,heal:19,rate:.6,range:0,desc:"Automatically repairs the weakest convoy vehicle."},
  {id:"laser",name:"PRISM CANNON",short:"PRISM",color:"#ff72d6",accent:"#ffd5f4",cost:155,unlock:12,damage:47,rate:1.2,range:310,pierce:2,desc:"A piercing beam burns through aligned enemies."},
  {id:"tesla",name:"STORM COIL",short:"STORM",color:"#a988ff",accent:"#e2d8ff",cost:175,unlock:20,damage:34,rate:1.05,range:275,chain:3,desc:"Arc lightning jumps between clustered targets."}

  {name:"EMBER RUN",zone:"Volcanic Causeway",themes:["volcano","forest","volcano","void"],sectors:4,difficulty:"MEDIUM",color:"#ff9a55",reward:6,boss:"siege",desc:"Carry coolant through an erupting war zone."},
  {name:"PHANTOM ROAD",zone:"Shrouded Ravine",themes:["void","forest","void","ice"],sectors:4,difficulty:"MEDIUM",color:"#b18cff",reward:7,boss:"jammer",desc:"Survive cloaked attackers and signal blackouts."},
  {name:"TITAN CROSSING",zone:"Iron Tundra",themes:["ice","volcano","ice","forest","void"],sectors:5,difficulty:"HARD",color:"#9ebdca",reward:8,boss:"crusher",desc:"Break an armored blockade before it closes."},

  {name:"LAST CONVOY",zone:"Rift Citadel",themes:["forest","ice","volcano","void","ice","volcano"],sectors:6,difficulty:"NIGHTMARE",color:"#ffd45a",reward:15,boss:"overlord",desc:"Every route converges on the final siege engine."}

const ENEMIES={
  normal:{hp:85,speed:54,damage:10,rate:1.1,scrap:10,size:58},fast:{hp:54,speed:92,damage:8,rate:1.45,scrap:9,size:50},armored:{hp:240,speed:35,damage:20,rate:.8,scrap:22,size:70},phantom:{hp:125,speed:68,damage:13,rate:1.05,scrap:17,size:59},brute:{hp:390,speed:30,damage:29,rate:.62,scrap:30,size:80},swarm:{hp:36,speed:105,damage:6,rate:1.7,scrap:6,size:42}

  {id:"salvage",name:"WRECKAGE FIELD",tag:"HIGH SALVAGE",color:"#ffd45a",desc:"Gain 120 Scrap. Enemies gain 18% health next sector.",apply:r=>{r.scrap+=120;r.nextHpMod*=1.18}},
  {id:"rift",name:"RIFT SHORTCUT",tag:"BONUS SHARD",color:"#c57aff",desc:"Earn 1 Shard if you survive. Enemies move 22% faster.",apply:r=>{r.shardsEarned++;r.nextSpeedMod*=1.22}},
  {id:"overclock",name:"OVERCHARGE LANE",tag:"MORE FIREPOWER",color:"#69d8ff",desc:"All weapons fire 12% faster. Ambushes arrive more often.",apply:r=>{r.fireRate*=1.12;r.nextSpawnMod*=1.18}},
  {id:"air",name:"AERIAL CORRIDOR",tag:"AIR SUPPORT",color:"#84baff",desc:"Reset air-support cooldowns. Fast enemies join the attack.",apply:r=>{r.abilities.strafe=0;r.abilities.airstrike=0;r.nextFastBias+=.3}},
  {id:"armor",name:"TITANIUM CACHE",tag:"PERMANENT ARMOR",color:"#a9c6d1",desc:"Increase every vehicle's maximum health by 12%.",apply:r=>r.convoy.forEach(v=>{v.maxHp*=1.12;v.hp+=v.maxHp*.12})}
];

const SAVE_KEY="riftConvoyProductionV1",LEGACY_KEYS=["riftConvoyDev","riftConvoyBeta"],CLOUD_WRITE_COOLDOWN=30000;
let shards=0,completed=[],bestScore=0,tutorialComplete=false,unlocked=["gun","frost","rocket","repair"],selectedLoadout=["gun","frost","rocket","repair"];
let cloudAvailable=false,cloudUser=null,cloudStatus="Device save — Cloud activates on CrazyGames",bootLocal=null,bootHadSave=false,pendingCloud=null,pendingTimer=null,lastCloudWrite=0;
let sdkReady=false,sdkInitStarted=false,sdkLoadingStopped=false,adInProgress=false,adblockDetected=false,adResumePaused=false,adKind="",adMessage="Watch a complete rewarded ad to receive 5 Shards.",adMessageColor="#91aeba";
let selectedExpedition=0,expeditionPage=0,armoryPage=0,tutorialStep=-1,tutorialFromMenu=false,selectedBuild=null,selectedHardpoint=-1,targetingAbility=null,reviveUsed=false;
let run=null;

function initMotes(){motes=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*2,v:5+Math.random()*18,a:.15+Math.random()*.4}));}
function preloadArt(){return Promise.all(Object.entries(ART).map(([k,src])=>new Promise(resolve=>{const im=new Image();im.onload=()=>{art[k]=im;resolve()};im.onerror=resolve;im.src=src}))).then(()=>{artReady=true;stopSdkLoading();reveal()});}
function preloadSounds(){for(const [k,src] of Object.entries(SOUNDS)){const a=new Audio(src);a.preload="auto";soundSamples[k]=a}}
function initAudio(){if(audioContext){if(audioContext.state==="suspended"&&!adInProgress&&!platformMuted)audioContext.resume().catch(()=>{});return}const A=window.AudioContext||window.webkitAudioContext;if(A)try{audioContext=new A()}catch(_){}}
function stopSounds(){for(const a of activeSounds){a.pause();a.currentTime=0}activeSounds.clear()}
function sfx(name){if(!soundEnabled||platformMuted||adInProgress)return;const now=performance.now(),gap=name==="repeater"?90:name==="hit"?80:35;if(now-(lastSoundAt[name]||0)<gap)return;lastSoundAt[name]=now;const base=soundSamples[name];if(!base)return;const a=base.cloneNode();a.volume=name==="explosion"?.28:name==="repeater"?.12:.21;activeSounds.add(a);a.addEventListener("ended",()=>activeSounds.delete(a),{once:true});a.play().catch(()=>activeSounds.delete(a))}

function sanitizeProgress(v){if(!v||typeof v!=="object"||!Number.isFinite(v.shards)||!Array.isArray(v.unlocked)||!Array.isArray(v.completed))return null;return{version:1,updatedAt:Number.isFinite(v.updatedAt)?clamp(Math.floor(v.updatedAt),0,Date.now()+300000):0,shards:Math.max(0,Math.floor(v.shards)),completed:[...new Set(v.completed.filter(n=>Number.isInteger(n)&&n>=0&&n<EXPEDITIONS.length))],bestScore:Math.max(0,Math.floor(v.bestScore||0)),tutorialComplete:v.tutorialComplete===true,soundEnabled:v.soundEnabled!==false,unlocked:[...new Set(["gun","frost","rocket","repair",...v.unlocked])].filter(id=>MODULES.some(m=>m.id===id)),selectedLoadout:Array.isArray(v.selectedLoadout)?v.selectedLoadout.filter(id=>MODULES.some(m=>m.id===id)).slice(0,4):["gun","frost","rocket","repair"]}}
function snapshot(t=Date.now()){return sanitizeProgress({version:1,updatedAt:t,shards,completed,bestScore,tutorialComplete,soundEnabled,unlocked,selectedLoadout})}
function applyProgress(v){const s=sanitizeProgress(v);if(!s)return false;shards=s.shards;completed=s.completed;bestScore=s.bestScore;tutorialComplete=s.tutorialComplete;soundEnabled=s.soundEnabled;unlocked=s.unlocked;selectedLoadout=s.selectedLoadout.filter(id=>unlocked.includes(id));for(const id of unlocked)if(selectedLoadout.length<4&&!selectedLoadout.includes(id))selectedLoadout.push(id);return true}
function storeLocal(v){try{localStorage.setItem(SAVE_KEY,JSON.stringify(v))}catch(_){}}
function loadLocal(){try{for(const k of LEGACY_KEYS)localStorage.removeItem(k);return sanitizeProgress(JSON.parse(localStorage.getItem(SAVE_KEY)||"null"))}catch(_){return null}}
function cloudLabel(){return cloudUser?"CrazyGames Cloud synced + device backup":"CrazyGames Cloud ready + device backup"}
function writeCloud(v){if(!cloudAvailable||!v)return false;try{window.CrazyGames.SDK.data.setItem(SAVE_KEY,JSON.stringify(v));lastCloudWrite=performance.now();pendingCloud=null;if(pendingTimer){clearTimeout(pendingTimer);pendingTimer=null}cloudStatus=cloudLabel();return true}catch(_){cloudStatus="Device save — Cloud temporarily unavailable";return false}}
function queueCloud(v,force=false){if(!cloudAvailable)return;pendingCloud=v;const wait=CLOUD_WRITE_COOLDOWN-(performance.now()-lastCloudWrite);if(force||wait<=0){writeCloud(v);return}if(pendingTimer)clearTimeout(pendingTimer);pendingTimer=setTimeout(()=>{pendingTimer=null;if(pendingCloud)writeCloud(pendingCloud)},wait)}
function saveProgress(force=false){const s=snapshot();if(!s)return;storeLocal(s);queueCloud(s,force)}
function flushCloud(){if(pendingCloud)writeCloud(pendingCloud)}
function loadCloud(){const d=window.CrazyGames?.SDK?.data;if(!d||typeof d.getItem!=="function"||typeof d.setItem!=="function")return false;try{for(const k of LEGACY_KEYS)d.removeItem?.(k);let cloud=null,raw=d.getItem(SAVE_KEY);if(raw){try{cloud=sanitizeProgress(JSON.parse(raw))}catch(_){}if(!cloud)d.removeItem?.(SAVE_KEY)}let chosen;if(cloud&&!bootHadSave)chosen=cloud;else if(cloud&&bootLocal)chosen=cloud.updatedAt>=bootLocal.updatedAt?cloud:bootLocal;else chosen=cloud||bootLocal;if(chosen){applyProgress(chosen);storeLocal(chosen)}cloudAvailable=true;cloudStatus=cloudLabel();if(!chosen)saveProgress(true);else if(!cloud||(bootLocal&&bootLocal.updatedAt>cloud.updatedAt))writeCloud(chosen);return true}catch(_){cloudAvailable=false;cloudStatus="Device save — Cloud temporarily unavailable";return false}}
function finishProgress(){progressReady=true;stopSdkLoading();reveal()}
async function initSdk(){if(sdkInitStarted||!window.CrazyGames?.SDK)return;sdkInitStarted=true;try{await window.CrazyGames.SDK.init();sdkReady=true;loadCloud();syncSdkSettings();window.CrazyGames.SDK.game?.addSettingsChangeListener?.(syncSdkSettings);try{cloudUser=Boolean(await window.CrazyGames.SDK.user?.getUser?.());cloudStatus=cloudLabel()}catch(_){cloudUser=null}try{adblockDetected=Boolean(await window.CrazyGames.SDK.ad?.hasAdblock?.())}catch(_){adblockDetected=false}finishProgress()}catch(_){sdkReady=false;sdkInitStarted=false;finishProgress()}}
function syncSdkSettings(){try{platformMuted=window.CrazyGames?.SDK?.game?.settings?.muteAudio===true;if(platformMuted)stopSounds()}catch(_){platformMuted=false}}
function sdkGame(name){if(!sdkReady)return;try{window.CrazyGames.SDK.game?.[name]?.()}catch(_){}}
function stopSdkLoading(){if(!sdkReady||!artReady||!progressReady||sdkLoadingStopped)return;try{window.CrazyGames.SDK.game?.loadingStop?.();sdkLoadingStopped=true}catch(_){}}
function reveal(){if(!artReady||!progressReady||!loading.isConnected)return;loading.classList.add("ready");setTimeout(()=>loading.remove(),430)}

function adErrorText(error){const code=error?.code||"other";if(code==="adsDisabledBasicLaunch")return"Ads are disabled during CrazyGames Basic Launch.";if(code==="adblock")return"Ad blocked — disable the blocker and reload.";if(code==="adCooldown")return"Ad cooldown active — please try again shortly.";if(code==="unfilled")return"No ad is available right now — try again later.";return"Ad unavailable — no reward was granted."}
function beginAd(){adResumePaused=gamePaused;gamePaused=true;stopSounds();if(audioContext?.state==="running")audioContext.suspend().catch(()=>{});adMessage="Ad in progress…";adMessageColor="#7de6ff"}
function endAd(){gamePaused=adResumePaused;if(soundEnabled&&!platformMuted&&audioContext?.state==="suspended")audioContext.resume().catch(()=>{})}
function requestRewarded(kind){if(adInProgress||!sdkReady)return;if(kind==="shards"&&state!=="REWARDS")return;if(kind==="revive"&&state!=="DEFEAT")return;adResumePaused=gamePaused;adInProgress=true;adKind=kind;adMessage="Loading ad…";adMessageColor="#7de6ff";let settled=false;const finish=()=>{if(settled)return;settled=true;adInProgress=false;endAd();if(kind==="shards"){shards+=5;saveProgress(true);adMessage="Reward received: +5 Shards!";adMessageColor="#82ffb4";burst(W/2,H/2,"#b76dff",36,170)}else reviveConvoy()};const fail=e=>{if(settled)return;settled=true;adInProgress=false;endAd();adMessage=adErrorText(e);adMessageColor="#ff879c"};try{const result=window.CrazyGames.SDK.ad.requestAd("rewarded",{adStarted:beginAd,adFinished:finish,adError:fail});if(result&&typeof result.catch==="function")result.catch(fail)}catch(e){fail(e)}}

function fillRound(x,y,w,h,r,fill,stroke=null,line=1){ctx.beginPath();ctx.roundRect(x,y,w,h,Math.min(r,w/2,h/2));ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke()}}
function text(str,x,y,size=18,color="#fff",align="center",weight=800){ctx.font=`${weight} ${size}px Inter,system-ui,sans-serif`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline="middle";ctx.fillText(String(str),x,y)}
function wrap(str,x,y,maxWidth,lineHeight,size=16,color="#b8d0da",align="center",weight=650,maxLines=4){const words=String(str).split(/\s+/),lines=[];let line="";ctx.font=`${weight} ${size}px Inter,system-ui,sans-serif`;for(const word of words){const test=line?`${line} ${word}`:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);lines.slice(0,maxLines).forEach((l,i)=>text(l,x,y+i*lineHeight,size,color,align,weight));return Math.min(lines.length,maxLines)*lineHeight}
function button(r,label,color="#2389ad",enabled=true,sub=""){const hover=enabled&&inside(mouse,r);fillRound(r.x,r.y,r.w,r.h,12,enabled?(hover?shade(color,22):color):"#26343c",enabled?(hover?"#d8f8ff":"#79cce4"):"#43535b",hover?3:2);text(label,r.x+r.w/2,r.y+r.h/2-(sub?8:0),Math.min(22,r.h*.34),enabled?"#fff":"#7c8d94","center",950);if(sub)text(sub,r.x+r.w/2,r.y+r.h/2+17,11,enabled?"#d9f6ff":"#64747b","center",750);return hover}
function shade(hex,amt){const n=parseInt(hex.slice(1),16),r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);return`#${(r<<16|g<<8|b).toString(16).padStart(6,"0")}`}
function inside(p,r){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h}
function drawBackdrop(){const im=art.menu;if(im){ctx.drawImage(im,0,0,W,H);ctx.fillStyle="rgba(2,9,15,.79)";ctx.fillRect(0,0,W,H)}else{ctx.fillStyle="#071520";ctx.fillRect(0,0,W,H)}const g=ctx.createRadialGradient(W/2,H*.42,60,W/2,H*.42,W*.72);g.addColorStop(0,"rgba(17,70,94,.18)");g.addColorStop(1,"rgba(1,7,12,.74)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle="rgba(90,197,235,.09)";ctx.lineWidth=1;for(let x=-H;x<W;x+=42){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+H,H);ctx.stroke()}for(let y=0;y<H;y+=42){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}}
function drawMotes(dt=0){for(const m of motes){m.y-=m.v*dt;if(m.y<-4){m.y=H+4;m.x=Math.random()*W}ctx.fillStyle=`rgba(105,214,255,${m.a})`;ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,TAU);ctx.fill()}}
function panel(x,y,w,h,accent="#55cfff",alpha=.93){ctx.save();ctx.shadowColor="#000b";ctx.shadowBlur=18;fillRound(x,y,w,h,18,`rgba(7,23,34,${alpha})`,accent+"66",2);ctx.restore()}
function topBack(label="MAIN MENU"){text(`‹ ${label}`,30,31,15,inside(mouse,{x:15,y:10,w:175,h:45})?"#fff":"#81a2b1","left",900)}
function drawLogo(y=122,scale=1){text("RIFT CONVOY",W/2,y,54*scale,"#effcff","center",950);text("MOBILE DEFENSE",W/2,y+46*scale,24*scale,"#7ce5ff","center",950);ctx.fillStyle="#bd76ff";ctx.beginPath();ctx.moveTo(W/2-205*scale,y+20*scale);ctx.lineTo(W/2-174*scale,y+10*scale);ctx.lineTo(W/2-188*scale,y+36*scale);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(W/2+205*scale,y+20*scale);ctx.lineTo(W/2+174*scale,y+10*scale);ctx.lineTo(W/2+188*scale,y+36*scale);ctx.closePath();ctx.fill()}
function drawShard(x,y,s=18){ctx.save();ctx.translate(x,y);ctx.shadowColor="#c57aff";ctx.shadowBlur=12;ctx.fillStyle="#b65eea";ctx.strokeStyle="#efd2ff";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*.72,-s*.15);ctx.lineTo(s*.45,s);ctx.lineTo(-s*.45,s);ctx.lineTo(-s*.72,-s*.15);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(0,s);ctx.moveTo(-s*.72,-s*.15);ctx.lineTo(s*.72,-s*.15);ctx.stroke();ctx.restore()}

function roadY(worldX){return 344+Math.sin(worldX/315)*48+Math.sin(worldX/137+1.15)*19}

function syncConvoyGeometry(){if(!run)return;for(let i=0;i<run.convoy.length;i++){const v=run.convoy[i],worldX=run.worldDistance+v.baseX;v.x=v.baseX;v.y=roadY(worldX);v.angle=roadAngle(worldX);const h=run.hardpoints[i];h.x=v.x;h.y=v.y;h.vehicleIndex=i}if(selectedHardpoint>=0&&run.convoy[run.hardpoints[selectedHardpoint]?.vehicleIndex]?.hp<=0)selectedHardpoint=-1}
function createRun(){const e=EXPEDITIONS[selectedExpedition],positions=vehiclePositions(),hull=1+selectedExpedition*.13,starter=selectedLoadout[0]||"gun",starterModule=moduleById(starter);run={expedition:selectedExpedition,sector:0,totalSectors:e.sectors,sectorTime:0,sectorDuration:34+selectedExpedition*2,worldDistance:0,scroll:0,previousTerrain:e.themes[0],currentTerrain:e.themes[0],terrainBlend:1,scrap:230+selectedExpedition*45,kills:0,score:0,shardsEarned:0,enemies:[],shots:[],convoy:positions.map((p,i)=>{const hp=(i===1?620:480)*hull;return{baseX:p.x,x:p.x,y:p.y,angle:p.angle,hp,maxHp:hp,name:i===0?"SCOUT":i===1?"RIFT CORE":i===2?"CARGO":"ESCORT"}}),hardpoints:positions.map((p,i)=>({x:p.x,y:p.y,vehicleIndex:i,type:i===0?starter:null,level:i===0?1:0,cooldown:0,angle:p.angle,disabled:0,spent:i===0?starterModule.cost:0})),spawnTimer:1,bossSpawned:false,choice:[],fireRate:1,damageMod:1,nextHpMod:1,nextSpeedMod:1,nextSpawnMod:1,nextFastBias:0,abilities:{strafe:0,airstrike:0,repair:0},airFx:[],danger:0,gameTime:0};syncConvoyGeometry();selectedBuild=null;selectedHardpoint=-1;targetingAbility=null;reviveUsed=false;gamePaused=!tutorialComplete;tutorialStep=tutorialComplete?-1:0;tutorialFromMenu=false;state="GAME";sdkGame("gameplayStart");sfx("wave")}
function startNextSector(){const e=EXPEDITIONS[selectedExpedition],oldTerrain=run.currentTerrain;run.sector++;run.previousTerrain=oldTerrain;run.currentTerrain=e.themes[run.sector]||e.themes[e.themes.length-1];run.terrainBlend=run.currentTerrain===oldTerrain?1:0;run.sectorTime=0;run.sectorDuration=34+selectedExpedition*2+run.sector*2;run.spawnTimer=1.2;run.bossSpawned=false;run.choice=[];state="GAME";gamePaused=false;selectedHardpoint=-1;targetingAbility=null;sfx("wave");showToast(`Sector ${run.sector+1}/${run.totalSectors} — Convoy moving!`,"#7de6ff")}
function routeChoices(){const safe=ROUTES.find(r=>r.id==="safe"),pool=ROUTES.filter(r=>r.id!=="safe"),out=[safe];while(out.length<3){const i=Math.floor(Math.random()*pool.length);out.push(pool.splice(i,1)[0])}return out.sort(()=>Math.random()-.5)}

function spawnEnemy(kind=null,boss=false){const exp=selectedExpedition,sector=run.sector,difficulty=1+exp*.34+sector*.22;if(boss){const hp=(1150+exp*420+sector*180)*run.nextHpMod;run.enemies.push({kind:"boss",boss:true,bossType:EXPEDITIONS[exp].boss,x:1240,y:350,hp,maxHp:hp,speed:(24+exp*1.5)*run.nextSpeedMod,damage:(34+exp*7)*(.82+sector*.04),rate:.55,cooldown:1,scrap:150+exp*25,size:112,angle:Math.PI,special:5,half:false,dead:false,slow:0});showToast(`${EXPEDITIONS[exp].boss.toUpperCase()} BOSS INCOMING`,"#ff7180");sfx("wave");return}if(!kind){const roll=Math.random(),progress=exp+sector,fast=Math.min(.3,.12+run.nextFastBias),phantom=fast+(progress>=7?.08:0),brute=phantom+(progress>=5?.1:0),armored=brute+(progress>=2?.18:0);if(roll<fast)kind="fast";else if(roll<phantom)kind="phantom";else if(roll<brute)kind="brute";else if(roll<armored)kind="armored";else if(roll>.92)kind="swarm";else kind="normal"}const b=ENEMIES[kind],hp=b.hp*difficulty*run.nextHpMod;const edge=Math.random(),y=edge<.18?FIELD_TOP+25:edge>.82?FIELD_BOTTOM-30:160+Math.random()*380;run.enemies.push({kind,boss:false,x:W+40+Math.random()*120,y,hp,maxHp:hp,speed:b.speed*(1+exp*.035)*run.nextSpeedMod,damage:b.damage*(.66+exp*.07+sector*.025),rate:b.rate,cooldown:.4+Math.random(),scrap:b.scrap,size:b.size,angle:Math.PI,dead:false,slow:0})}
function weakestVehicle(){return run.convoy.filter(v=>v.hp>0).sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0]}
function livingVehicleClosest(e){return run.convoy.filter(v=>v.hp>0).sort((a,b)=>dist(e.x,e.y,a.x,a.y)-dist(e.x,e.y,b.x,b.y))[0]}
function damageEnemy(e,dmg,color="#fff"){if(!e||e.dead)return;e.hp-=dmg;burst(e.x,e.y,color,3,45);if(e.hp<=0){e.dead=true;run.scrap+=e.scrap;run.kills++;run.score+=Math.floor(e.maxHp+e.scrap*4);burst(e.x,e.y,e.boss?"#ff6370":"#8ce6ff",e.boss?48:15,e.boss?190:90);sfx(e.boss?"explosion":"hit")}}
function moduleStats(h){const m=moduleById(h.type),l=h.level,mul=Math.pow(1.34,l-1);return{damage:(m.damage||0)*mul,heal:(m.heal||0)*Math.pow(1.3,l-1),rate:(m.rate||1)*Math.pow(1.12,l-1)*run.fireRate,range:(m.range||0)*(1+.07*(l-1)),splash:(m.splash||0)*(1+.08*(l-1)),chain:(m.chain||0)+(l>=4?1:0),pierce:(m.pierce||0)+(l>=3?1:0),slow:m.slow||0}}
function targetFor(h,stats){return run.enemies.filter(e=>!e.dead&&dist(h.x,h.y,e.x,e.y)<=stats.range).sort((a,b)=>a.x-b.x)[0]}
function updateModules(dt){for(const h of run.hardpoints){const vehicle=run.convoy[h.vehicleIndex];h.cooldown-=dt;h.disabled=Math.max(0,h.disabled-dt);if(!vehicle||vehicle.hp<=0){if(vehicle)h.angle=vehicle.angle;continue}const rest=vehicle.angle;if(!h.type||h.disabled>0){h.angle=moveAngle(h.angle,rest,dt*4);continue}const m=moduleById(h.type),s=moduleStats(h);if(h.type==="repair"){h.angle=moveAngle(h.angle,rest,dt*4);if(h.cooldown<=0){const v=weakestVehicle();if(v&&v.hp<v.maxHp){v.hp=Math.min(v.maxHp,v.hp+s.heal);run.score+=Math.floor(s.heal);burst(v.x,v.y,"#77f1b0",7,50);h.cooldown=1/s.rate}}continue}const target=targetFor(h,s);if(target){const aim=Math.atan2(target.y-h.y,target.x-h.x);h.angle=moveAngle(h.angle,aim,dt*7);if(h.cooldown<=0){fireModule(h,m,s,target);h.cooldown=1/s.rate}}else h.angle=moveAngle(h.angle,rest,dt*3.5)}}
function moveAngle(a,b,step){const d=Math.atan2(Math.sin(b-a),Math.cos(b-a));return Math.abs(d)<=step?b:a+Math.sign(d)*step}
function fireModule(h,m,s,target){sfx(m.id==="rocket"?"explosion":m.id==="gun"?"repeater":"blaster");if(m.id==="rocket"){for(const e of run.enemies)if(!e.dead&&dist(e.x,e.y,target.x,target.y)<=s.splash)damageEnemy(e,s.damage*(e===target?1:.62),m.color);run.shots.push({type:"blast",x:target.x,y:target.y,life:.28,max:.28,color:m.color,r:s.splash})}else if(m.id==="tesla"){let current=target,used=[];for(let i=0;i<s.chain;i++){if(!current)break;used.push(current);damageEnemy(current,s.damage*Math.pow(.8,i),m.color);const from=current;current=run.enemies.filter(e=>!e.dead&&!used.includes(e)&&dist(e.x,e.y,from.x,from.y)<115).sort((a,b)=>dist(a.x,a.y,from.x,from.y)-dist(b.x,b.y,from.x,from.y))[0];run.shots.push({type:"beam",x:i?used[i-1].x:h.x,y:i?used[i-1].y:h.y,tx:from.x,ty:from.y,life:.13,max:.13,color:m.color})}}else if(m.id==="laser"){const angle=Math.atan2(target.y-h.y,target.x-h.x),hits=run.enemies.filter(e=>!e.dead&&distPointLine(e.x,e.y,h.x,h.y,h.x+Math.cos(angle)*s.range,h.y+Math.sin(angle)*s.range)<30&&((e.x-h.x)*Math.cos(angle)+(e.y-h.y)*Math.sin(angle))>0).sort((a,b)=>dist(h.x,h.y,a.x,a.y)-dist(h.x,h.y,b.x,b.y)).slice(0,s.pierce);hits.forEach((e,i)=>damageEnemy(e,s.damage*Math.pow(.86,i),m.color));run.shots.push({type:"beam",x:h.x,y:h.y,tx:h.x+Math.cos(angle)*s.range,ty:h.y+Math.sin(angle)*s.range,life:.12,max:.12,color:m.color})}else{damageEnemy(target,s.damage,m.color);if(m.id==="frost")target.slow=Math.max(target.slow,1.6+s.slow);run.shots.push({type:"beam",x:h.x,y:h.y,tx:target.x,ty:target.y,life:.09,max:.09,color:m.color})}}

function canvasPoint(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
canvas.addEventListener("pointermove",e=>{const p=canvasPoint(e);mouse={...p,inside:true}});canvas.addEventListener("pointerleave",()=>mouse.inside=false);canvas.addEventListener("pointerdown",e=>{e.preventDefault();const p=canvasPoint(e);pointerDown(p.x,p.y,e.button)});canvas.addEventListener("contextmenu",e=>e.preventDefault());window.addEventListener("keydown",keyDown);window.addEventListener("pagehide",flushCloud);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flushCloud()});

function frame(now){let dt=Math.min(.033,(now-lastTime)/1000||0);lastTime=now;elapsed+=dt*(state==="GAME"&&!gamePaused?gameSpeed:1);if(toast.time>0)toast.time-=dt;updateParticles(dt);if(state==="GAME"&&!gamePaused&&tutorialStep<0&&!adInProgress){let sim=dt*gameSpeed;while(sim>0&&state==="GAME"){const step=Math.min(.025,sim);updateGame(step);sim-=step}}screenShake=Math.max(0,screenShake-dt*20);ctx.clearRect(0,0,W,H);ctx.fillStyle="#06121c";ctx.fillRect(0,0,W,H);ctx.save();if(screenShake)ctx.translate((Math.random()-.5)*screenShake,(Math.random()-.5)*screenShake);if(state==="MENU")drawMenu(dt);else if(state==="EXPEDITIONS")drawExpeditions();else if(state==="LOADOUT")drawLoadout();else if(state==="ARMORY")drawArmory();else if(state==="REWARDS")drawRewards();else if(state==="GAME")drawGame();else if(state==="ROUTE")drawRoute();else if(state==="VICTORY")drawVictory();else if(state==="DEFEAT")drawDefeat();ctx.restore();requestAnimationFrame(frame)}

bootLocal=loadLocal();bootHadSave=Boolean(bootLocal);if(bootLocal)applyProgress(bootLocal);setTimeout(()=>{if(!progressReady)finishProgress()},2500);initMotes();preloadSounds();preloadArt();window.addEventListener("crazygames-sdk-ready",initSdk);initSdk();requestAnimationFrame(frame);

if(new URLSearchParams(location.search).has("test"))window.__RIFT_TEST__={
  get state(){return state},get run(){return run},get progress(){return snapshot()},get loadout(){return[...selectedLoadout]},get assets(){return{declared:Object.keys(ART).length,loaded:Object.keys(art).length,missing:Object.keys(ART).filter(k=>!art[k])}},
  roadAt(x){return{y:roadY(run.worldDistance+x),angle:roadAngle(run.worldDistance+x)}},geometry(){return run.convoy.map((v,i)=>({vehicle:{x:v.x,y:v.y,angle:v.angle,hp:v.hp},hardpoint:{x:run.hardpoints[i].x,y:run.hardpoints[i].y,angle:run.hardpoints[i].angle,type:run.hardpoints[i].type}}))},
  start(exp=0,loadout=["gun","frost","rocket","repair"]){selectedExpedition=clamp(exp,0,EXPEDITIONS.length-1);tutorialComplete=true;selectedLoadout=loadout.slice(0,4);createRun()},destroy(index){if(run?.convoy[index]){run.convoy[index].hp=0;syncConvoyGeometry()}},
  install(slot,id){if(run){run.scrap=9999;installModule(slot,id)}},upgrade(slot){if(run){run.scrap=9999;upgradeModule(slot)}},spawn(kind="normal"){if(run)spawnEnemy(kind)},boss(){if(run)spawnEnemy(null,true)},step(seconds){if(run)for(let t=0;t<seconds;t+=.025)updateGame(.025)},
  ad(kind="shards"){requestRewarded(kind)},setState(v){state=v},setSdk(v=true){sdkReady=v},setShards(v){shards=v},save(){saveProgress(true)},reset(){localStorage.removeItem(SAVE_KEY)},
  unlockAll(){unlocked=MODULES.map(m=>m.id);completed=EXPEDITIONS.map((_,i)=>i);selectedLoadout=["rocket","laser","tesla","repair"]},setExpedition(v){selectedExpedition=clamp(v,0,EXPEDITIONS.length-1)},setTutorial(v){tutorialStep=v;gamePaused=v>=0},
  checkpoint(){if(run)enterCheckpoint()},chooseRoute(index=0){if(run?.choice[index])chooseRoute(run.choice[index])},win(){if(run)finishExpedition()},lose(){if(run)defeat()},
  boost(){if(!run)return;run.scrap=99999;run.convoy.forEach(v=>{v.maxHp=1e9;v.hp=1e9});run.hardpoints.forEach((h,i)=>Object.assign(h,{type:selectedLoadout[i]||"gun",level:4,spent:999,cooldown:0}));run.sectorDuration=3},
  constants:{MODULES,EXPEDITIONS,SAVE_KEY}
};
